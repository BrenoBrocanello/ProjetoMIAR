name: miar
description: Mapeamento e identificação de animais de risco.
publish_to: none
version: 1.0.0+3
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.11.1
  go_router: 17.0.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  image_picker: 1.2.1
  flutter_image_compress: ^2.5.1
  url_launcher: 6.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_local_notifications: 20.1.0
  background_fetch: ^1.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/img/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
